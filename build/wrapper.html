/* One dark room, two monitors. Left path: the River terminal. Right path: a window onto Ganymede.
   Tokens are the terminal's own, so the bezels, plates and phosphors are one family. */
:root {

* { box-sizing: border-box; }

  display: grid; grid-template-columns: 1fr 0fr; column-gap: 0;
  padding: 0 clamp(8px, 1.4vw, 24px);

  transition: opacity .9s .35s, transform 1.1s .25s cubic-bezier(.2, .7, .2, 1), visibility 0s .0s; }

  const t1 = performance.now(); await new Promise(res => { (function st() { dosFinal = dosSkip ? 1 : clamp((performance.now() - t1) / 900, 0, 1); if (dosFinal >= 1) return res(); requestAnimationFrame(st); })(); });
  const o = lnSeg([["opening the window ", "d"], ["...", "o"]]); await sleep(520);
}
function flash() { const f = $("flash"); f.classList.remove("go"); void f.offsetWidth; f.classList.add("go"); }
function endDos() { dosEl.classList.add("out"); setTimeout(() => { dosEl.hidden = true; dosRunning = false; }, 950); }

/* ============ the third update: terminal -> MOON.DOS -> splash ============ */
function enterSplash(instant) {
  const b = document.body;
  if (instant) b.classList.add("nofx");
  b.classList.add("splash"); splashT0 = performance.now();
  layoutMoon(); setTimeout(layoutMoon, 400); setTimeout(layoutMoon, 1100);
  if (instant) setTimeout(() => b.classList.remove("nofx"), 60);
}
let busy = false;
async function thirdUpdate() {
  if (busy) return; busy = true;
  await runDos();
  flash(); enterSplash(false);
  await new Promise(r => setTimeout(r, 1050));
  term.contentWindow.postMessage({ tesela: "enter" }, "*");
  endDos(); busy = false;
}
window.addEventListener("message", e => {
  if (e.source !== term.contentWindow || !e.data || !e.data.tesela) return;
  if (e.data.tesela === "third") thirdUpdate();
  else if (e.data.tesela === "moon") { kick = (performance.now() - t0) / 1000; }
});
const skipKey = e => { if (dosRunning && !dosEl.hidden) { skipDos(); } };
addEventListener("keydown", skipKey); dosEl.addEventListener("pointerdown", skipKey);
$("mpower").addEventListener("click", async () => { if (busy) return; busy = true; await runDos(); flash(); await new Promise(r => setTimeout(r, 300)); endDos(); kick = (performance.now() - t0) / 1000; busy = false; });

/* ============ power on ============ */
const raw = atob($("termdata").textContent.trim());
const bytes = Uint8Array.from(raw, c => c.charCodeAt(0));
const html = new TextDecoder("utf-8").decode(bytes);
const hash = (location.hash || "").slice(1);
if (hash === "splash" || hash === "dos") term.name = "river-world";
term.srcdoc = html;
term.addEventListener("load", () => {
  if (hash === "splash") { enterSplash(true); }
  else if (hash === "dos") { thirdUpdate(); }
  setTimeout(() => { try { term.contentWindow.focus(); } catch (e) {} }, 300);
});
layoutMoon();
})();
